<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feather Atlas</title>
<meta name="description" content="Feather Atlas — an interactive 3D field guide to the hoopoe and the kingfisher.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://d8j0ntlcm91z4.cloudfront.net" crossorigin>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

<style>
:root{
  --bg:#f6f1e7; --panel:#fbf8f1; --line:#e7e0d1; --ink:#1b1a17; --muted:#6d685d;
  --sage:#4d5a3d; --sage-ink:#ffffff; --sage-tint:#e9ebdc; --chip:#efeadd; --shadow:60,48,28;
  --ease:cubic-bezier(.22,.8,.24,1);
  --serif:"Newsreader","Iowan Old Style",Georgia,serif;
  --sans:"Nunito Sans","Segoe UI",system-ui,sans-serif;
}
.hero[data-light="dusk"]{
  --bg:#14170f; --panel:#1b1f15; --line:#2d3324; --ink:#f2ecdf; --muted:#a8a392;
  --sage:#a9b98a; --sage-ink:#14170f; --sage-tint:#283020; --chip:#262b1d; --shadow:0,0,0;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  transition:background-color .6s;
}
body.dusk{background:#14170f}
h1,h2,h3,p,ul{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- Hero grid ---------- */
.hero{
  position:relative;height:100vh;height:100dvh;overflow:hidden;
  display:grid;grid-template-columns:196px minmax(0,1fr) clamp(300px,27vw,356px);
  background:var(--bg);color:var(--ink);transition:background-color .6s,color .6s;
}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:5;pointer-events:none}

/* ---------- Sidebar ---------- */
.side{
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
  padding:22px 12px 18px 24px;border-right:1px solid var(--line);
  transition:opacity .5s var(--ease),transform .5s var(--ease),border-color .6s;
}
.brand{font-family:var(--serif);font-size:26px;letter-spacing:-.01em;line-height:1.1;font-weight:400}
.nav{list-style:none;padding:0;margin:20px 0 12px;display:grid;gap:2px}
.nav button{
  display:flex;gap:16px;align-items:flex-start;width:100%;padding:7px 10px;border-radius:10px;
  font-size:14.5px;line-height:1.25;text-align:left;transition:background-color .2s;
}
.nav button:hover{background:var(--chip)}
.nav button[aria-current="page"]{background:var(--sage-tint)}
.nav .ic{margin-top:-1px}
.nav small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.feat{margin-top:auto;background:var(--sage-tint);border-radius:10px;padding:14px 14px 16px;transition:background-color .6s}
.feat img{display:block;width:92px;height:76px;object-fit:contain;margin:8px auto 6px}
.feat h3{font-family:var(--serif);font-weight:400;font-size:18px;line-height:1.2;margin-top:6px}
.feat p{font-size:12px;color:var(--muted);line-height:1.4;margin-top:4px}
.feat a{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.feat a .ic{width:14px;height:14px}

/* ---------- Centre ---------- */
.main{display:grid;grid-template-rows:auto minmax(0,1fr);padding:48px 18px 14px 26px;min-width:0;min-height:0}
.tabs{display:flex;gap:10px;transition:opacity .5s var(--ease),transform .5s var(--ease)}
.tab{
  width:130px;padding:8px 8px 11px;display:grid;justify-items:center;text-align:center;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  transition:transform .3s var(--ease),background-color .6s,border-color .3s;
}
.tab:hover{transform:translateY(-2px)}
.tab img{width:58px;height:52px;object-fit:contain}
.tab .nm{font-family:var(--serif);font-size:15.5px;line-height:1.2;margin-top:4px}
.tab .lt{font-family:var(--serif);font-style:italic;font-size:12.5px;line-height:1.3;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--sage-tint);border-color:color-mix(in srgb,var(--sage) 45%,transparent)}

#stage{
  position:relative;min-height:0;margin-top:10px;touch-action:none;cursor:grab;
  user-select:none;-webkit-user-select:none;
}
#stage.grabbing{cursor:grabbing}
.ground{
  position:absolute;left:50%;bottom:15%;width:min(62%,460px);height:44px;pointer-events:none;
  transform:translateX(-50%);background:radial-gradient(closest-side,rgba(var(--shadow),.22),transparent);
  transition:opacity .45s var(--ease),transform .45s var(--ease);
}
#stage.switching .ground{opacity:0;transform:translateX(-50%) scaleX(.4)}
.loader{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:12px;
  font-size:12.5px;color:var(--muted);white-space:nowrap;opacity:0;transition:opacity .4s;pointer-events:none;
}
.loader.show{opacity:1}
.ring{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);border-top-color:var(--sage);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fallback{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(72%,520px);max-height:72%;
  object-fit:contain;display:none;pointer-events:none;
}
.fallback.show{display:block}
.hint{
  position:absolute;top:4px;right:0;z-index:6;display:flex;align-items:center;gap:7px;
  font-size:11.5px;color:var(--muted);pointer-events:none;transition:opacity .6s;
}
.hint .ic{width:16px;height:16px}
.hint.gone{opacity:0}
.rail{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:6;display:grid;gap:9px}
.rbtn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--line);
  transition:background-color .25s,border-color .25s,color .25s,transform .15s;
}
.rbtn .ic{width:17px;height:17px}
.rbtn:hover{border-color:var(--sage)}
.rbtn:active{transform:scale(.92)}
.rbtn.on{background:var(--sage);border-color:var(--sage);color:var(--sage-ink)}
.turn{
  position:absolute;bottom:46px;left:50%;transform:translateX(-50%);z-index:6;
  display:flex;align-items:center;gap:2px;padding:3px 6px;font-size:13px;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  transition:background-color .6s,border-color .6s;
}
.turn button{height:28px;min-width:28px;padding:0 6px;border-radius:999px;display:grid;place-items:center;transition:background-color .2s}
.turn button:hover{background:var(--chip)}
.turn .ic{width:16px;height:16px}
.turn .deg{font-weight:600;font-variant-numeric:tabular-nums;padding:0 8px}
.caption{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);z-index:6;width:max-content;max-width:100%;
  font-family:var(--serif);font-style:italic;font-size:clamp(16px,1.55vw,20px);line-height:1.3;
  text-align:center;text-wrap:balance;pointer-events:none;
}

/* ---------- Right column ---------- */
.info{
  display:grid;grid-template-rows:auto minmax(0,1fr);gap:16px;padding:13px 26px 14px 0;min-width:0;min-height:0;
  transition:opacity .5s var(--ease),transform .5s var(--ease);
}
.topbar{display:flex;align-items:center;gap:6px}
.mini-brand{display:none}
.search{
  flex:1;min-width:0;height:32px;display:flex;align-items:center;gap:8px;padding:0 10px 0 4px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;transition:background-color .6s,border-color .25s;
}
.search:focus-within{border-color:var(--sage)}
.search-btn{width:24px;height:24px;display:grid;place-items:center;color:var(--muted);flex:none;border-radius:50%}
.search-btn .ic{width:15px;height:15px}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:11.5px;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.ibtn{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;transition:background-color .2s}
.ibtn:hover{background:var(--chip)}
.avatar{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);transition:background-color .6s,color .6s}
.avatar .ic{width:15px;height:15px}

.card{
  display:flex;flex-direction:column;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px 20px 16px;
  transition:background-color .6s,border-color .6s;
}
.card::-webkit-scrollbar{width:6px}
.card::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.card article{flex:1 0 auto;display:flex;flex-direction:column;outline:none}
.card h1{font-family:var(--serif);font-weight:500;font-size:clamp(40px,4.2vw,54px);line-height:1;letter-spacing:-.025em;margin-top:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tags span{font-size:11.5px;padding:6px 13px;border-radius:999px;background:var(--chip);transition:background-color .6s}
.desc{font-size:13.5px;line-height:1.55;text-wrap:pretty;margin-top:16px}
.card h2{font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.2;border-top:1px solid var(--line);padding-top:14px;margin:18px 0 8px}
.trait{display:grid;grid-template-columns:22px 88px 1fr;gap:16px;align-items:center;font-size:13px;line-height:1.35;padding:5px 0}
.trait .ic{color:var(--sage)}
.trait .lbl{color:var(--muted)}
.trait.habitat{grid-template-columns:22px 1fr;margin-bottom:18px}
.closeup{
  margin-top:auto;display:grid;grid-template-columns:76px 1fr 18px;gap:14px;align-items:center;width:100%;
  padding:10px;border:1px solid var(--line);border-radius:8px;text-align:left;
  transition:border-color .25s,background-color .25s;
}
.closeup:hover,.closeup[aria-pressed="true"]{border-color:var(--sage);background:var(--sage-tint)}
.lens{width:76px;height:76px;border-radius:50%;background-color:var(--chip);background-size:520%;background-repeat:no-repeat;border:1px solid var(--line)}
.closeup strong{display:block;font-family:var(--serif);font-weight:400;font-size:18px;line-height:1.2}
.closeup small{display:block;font-size:11.5px;line-height:1.4;color:var(--muted);margin-top:3px}
.closeup > .ic{width:18px;height:18px;transition:transform .4s var(--ease)}
.closeup[aria-pressed="true"] > .ic{transform:rotate(180deg)}

/* ---------- Focus mode ---------- */
.hero.focus .side{opacity:0;transform:translateX(-24px);pointer-events:none}
.hero.focus .info{opacity:0;transform:translateX(24px);pointer-events:none}
.hero.focus .tabs{opacity:0;transform:translateY(-16px);pointer-events:none}

/* ---------- Short desktop ---------- */
@media (max-height:620px) and (min-width:1101px){
  .side{padding-top:14px}
  .nav{margin:12px 0 8px}
  .nav button{padding:5px 10px}
  .main{padding-top:22px}
  .feat img,.feat p{display:none}
}

/* ---------- Tablet ---------- */
@media (max-width:1100px){
  .hero{grid-template-columns:minmax(0,1fr) clamp(280px,36vw,340px)}
  .side{display:none}
  .main{padding-left:20px}
}

/* ---------- Phone ---------- */
@media (max-width:760px){
  .hero{display:flex;flex-direction:column}
  .info{display:contents}
  .topbar{order:1;position:relative;padding:10px 14px 0;transition:opacity .5s var(--ease)}
  .mini-brand{display:block;margin-right:auto;font-family:var(--serif);font-size:21px;letter-spacing:-.01em;white-space:nowrap}
  .search{flex:none;width:32px;padding:0;justify-content:center;border-radius:50%}
  .search input{display:none}
  .topbar.search-open .search{position:absolute;top:10px;left:14px;right:14px;width:auto;z-index:8;justify-content:flex-start;padding:0 10px 0 4px;border-radius:8px}
  .topbar.search-open .search input{display:block}
  .main{order:2;flex:1;padding:10px 14px 6px}
  .tabs{display:grid;grid-template-columns:1fr 1fr}
  .tab{width:auto;grid-template-columns:44px minmax(0,1fr);column-gap:10px;justify-items:start;align-items:center;text-align:left;padding:6px 10px}
  .tab img{width:44px;height:40px;grid-row:span 2}
  .tab .nm{font-size:15px;margin-top:0;align-self:end}
  .tab .lt{font-size:12px;align-self:start}
  .rail{gap:7px}
  .rbtn{width:34px;height:34px}
  .turn{bottom:30px}
  .caption{font-size:15px}
  .hint{display:none}
  .ground{bottom:17%;height:30px}
  .card{
    order:3;position:relative;z-index:7;flex:none;max-height:40dvh;
    border-width:1px 0 0;border-radius:16px 16px 0 0;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    transition:max-height .5s var(--ease),padding .5s var(--ease),transform .5s var(--ease),opacity .4s,background-color .6s,border-color .6s;
  }
  .card h1{font-size:34px}
  .card h2{font-size:19px}
  .hero.focus .topbar{opacity:0;pointer-events:none}
  .hero.focus .card{max-height:0;padding-top:0;padding-bottom:0;transform:translateY(40px);opacity:0;pointer-events:none}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important}
}
</style>
</head>

/* Stage: pointer / wheel / keyboard */
const pointers = new Map();

  scene.add(key, rim);

  const DAY = { env: 0.95, key: 1.6, keyColor: new THREE.Color(0xfff4e2), rim: 0.5, exp: 1.05 };
  const DUSK = { env: 0.28, key: 2.6, keyColor: new THREE.Color(0xffc98a), rim: 1.9, exp: 1.0 };
  const cur = { env: 0.95, key: 1.6, rim: 0.5, exp: 1.05 };

  HOME = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.12, 0.75, 0, 'YXZ'));
  const AX_Y = new THREE.Vector3(0, 1, 0), AX_X = new THREE.Vector3(1, 0, 0);
  const qa = new THREE.Quaternion(), qb = new THREE.Quaternion();
  const rotate = (spin, ay, ax) => {
    if (ay) spin.quaternion.premultiply(qa.setFromAxisAngle(AX_Y, ay));
    if (ax) spin.quaternion.premultiply(qb.setFromAxisAngle(AX_X, ax));
    spin.quaternion.normalize();
  };
  rotateWorld = (ay, ax) => rotate(rigs[active].spin, ay, ax);

  rigs = BIRDS.map(() => {
    const pivot = new THREE.Group(), spin = new THREE.Group(), holder = new THREE.Group();
    pivot.add(spin); spin.add(holder); spin.quaternion.copy(HOME);
    pivot.visible = false; scene.add(pivot);
    return { pivot, spin, holder, loaded: false, failed: false, promise: null, sc: 1, x: 0, yaw: 0 };
  });

  const draco = new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
  const gltfLoader = new GLTFLoader().setDRACOLoader(draco).setMeshoptDecoder(MeshoptDecoder);
  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  const onLoaded = (i) => {
    const now = performance.now(), tr = S.transition;
    if (tr && tr.to === i && tr.inStart == null) tr.inStart = now;
    else if (i === active && !tr && rigs[i].loaded && !reduced()) {
      // first appearance: grow in with the same overshoot as a tab switch
      S.transition = { from: -1, to: i, dir: 0, outStart: now - DUR, inStart: now, bs: 0, bx: 0, by: 0 };
      stage.classList.add('switching');
    }
    updateStageUI();
  };

  load = (i) => {
    const r = rigs[i];
    if (r.promise) return r.promise;
    r.promise = new Promise((resolve) => {
      gltfLoader.load(BIRDS[i].glb, (gltf) => {
        const model = gltf.scene;
        model.updateMatrixWorld(true);
        const sphere = new THREE.Box3().setFromObject(model).getBoundingSphere(new THREE.Sphere());
        model.position.sub(sphere.center);
        r.holder.scale.setScalar(1 / (sphere.radius || 1));
        model.traverse((o) => {
          if (!o.isMesh) return;
          o.frustumCulled = false;
          (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => {
            if (m && m.map) { m.map.anisotropy = maxAniso; m.map.needsUpdate = true; }
          });
        });
        r.holder.add(model);
        r.loaded = true;
        resolve(true); onLoaded(i);
      }, undefined, (err) => {
        console.warn('Feather Atlas: model failed to load', BIRDS[i].name, err);
        r.failed = true;
        resolve(false); onLoaded(i);
      });
    });
    return r.promise;
  };

  onResize3D = () => {
    const w = Math.round(S.W), h = Math.round(S.H);
    const size = renderer.getSize(new THREE.Vector2());
    if (size.x !== w || size.y !== h) renderer.setSize(w, h, false);
  };
  onResize3D();
  ready = true;

  rigs[active].spin.quaternion.copy(HOME);
  updateStageUI();
  const first = active;
  load(first).then(() => load(1 - first));

  let last = performance.now();
  const frame = (now) => {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    const t = now / 1000, rm = reduced();

    const kf = 1 - Math.exp(-dt * 7);
    S.cx += (S.tcx - S.cx) * kf; S.cy += (S.tcy - S.cy) * kf; S.px += (S.tpx - S.px) * kf;
    S.zoom += (S.zoomT - S.zoom) * (1 - Math.exp(-dt * 6));

    const r = rigs[active];
    if (!S.dragging) {
      if (Math.abs(S.vel.x) + Math.abs(S.vel.y) > 1e-4) {
        rotate(r.spin, S.vel.x * dt, S.vel.y * dt);
        const d = Math.exp(-dt * 4.5); S.vel.x *= d; S.vel.y *= d;
      } else S.vel.x = S.vel.y = 0;
    }
    if (S.turnQ) {
      let s = S.turnQ * (1 - Math.exp(-dt * 4.2));
      if (Math.abs(S.turnQ - s) < 1e-4) s = S.turnQ;
      rotate(r.spin, s, 0); S.turnQ -= s;
    }
    if (S.pitchQ) {
      let s = S.pitchQ * (1 - Math.exp(-dt * 4.2));
      if (Math.abs(S.pitchQ - s) < 1e-4) s = S.pitchQ;
      rotate(r.spin, 0, s); S.pitchQ -= s;
    }
    if (S.resetting) {
      r.spin.quaternion.slerp(HOME, 1 - Math.exp(-dt * 6));
      if (r.spin.quaternion.angleTo(HOME) < 1e-3) { r.spin.quaternion.copy(HOME); S.resetting = false; }
    }

    const quiet = !rm && !S.dragging && now - S.lastInteract > 1800;
    S.idle = quiet ? Math.min(1, S.idle + dt / 1.5) : Math.max(0, S.idle - dt / 0.6);
    const ia = S.idle * S.idle * (3 - 2 * S.idle);
    const swayY = Math.sin(t * 0.55) * 0.16 * ia, swayX = Math.sin(t * 0.9) * 0.03 * ia;

    const slide = S.stageW * 0.95 / Math.max(1, S.px);
    const tr = S.transition;
    rigs.forEach((rg, i) => {
      let sc = 1, x = 0, yaw = 0, vis = i === active;
      if (tr) {
        if (i === tr.from) {
          const p = Math.min(1, (now - tr.outStart) / (DUR * 0.6)), e = p * p * p;
          sc = tr.bs * (1 - e); x = tr.bx - tr.dir * e * slide; yaw = tr.by - tr.dir * e * 1.4; vis = p < 1;
        } else if (i === tr.to) {
          if (tr.inStart == null) vis = false;
          else {
            const p = Math.min(1, Math.max(0, (now - tr.inStart) / DUR));
            const e = 1 - Math.pow(1 - p, 3), q = p - 1;
            const ob = 1 + 2.2 * q * q * q + 1.2 * q * q;
            sc = ob * (0.25 + 0.75 * e); x = tr.dir * (1 - e) * slide; yaw = tr.dir * (1 - e) * 1.6;
          }
        } else vis = false;
      }
      rg.sc = sc; rg.x = x; rg.yaw = yaw;
      rg.pivot.visible = vis && rg.loaded;
      rg.pivot.position.set(x, rm ? 0 : Math.sin(t * 1.3 + i) * 0.028, 0);
      rg.pivot.rotation.set(swayX, swayY + yaw, 0);
      rg.pivot.scale.setScalar(Math.max(1e-4, sc));
    });
    if (tr && now - tr.outStart >= DUR * 0.6 && tr.inStart != null && now - tr.inStart >= DUR) {
      S.transition = null; stage.classList.remove('switching');
    }

    const L = S.dusk ? DUSK : DAY, kl = 1 - Math.exp(-dt * 4);
    cur.env += (L.env - cur.env) * kl; cur.key += (L.key - cur.key) * kl;
    cur.rim += (L.rim - cur.rim) * kl; cur.exp += (L.exp - cur.exp) * kl;
    scene.environmentIntensity = cur.env;
    key.intensity = cur.key; key.color.lerp(L.keyColor, kl);
    rim.intensity = cur.rim;
    renderer.toneMappingExposure = cur.exp;

    const z = S.H / (2 * TAN * S.px * S.zoom);
    camera.position.set(0, 0, z);
    camera.near = Math.max(0.01, z * 0.05); camera.far = z + 20;
    camera.aspect = S.W / S.H;
    camera.setViewOffset(S.W, S.H, S.W / 2 - S.cx, S.H / 2 - S.cy, S.W, S.H);
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
  };
  requestAnimationFrame(frame);
}

init3D().catch((err) => {
  console.warn('Feather Atlas: 3D unavailable, showing illustrations instead.', err);
  glFailed = true; ready = false;
  updateStageUI();
});
</script>
</body>
</html>
