<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leon Vasari — Archivo fílmico</title>
<meta name="description" content="Archivo fílmico de Leon Vasari: doce películas en VHS sobre una estantería curva.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.higgs.ai" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Noto+Sans+JP:wght@500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@800&text=%E6%98%A0%E7%94%BB%E3%81%AE%E8%A8%98%E6%86%B6&display=block">
<style>
:root{
  --paper:#ECE8E0; --sheet:#F3F0EA; --ink:#141414; --muted:#6D6A63; --cobalt:#1F3FB0; --rule:rgba(20,20,20,.9);
  --ease:cubic-bezier(.2,.8,.2,1);
  --H:min(47vh,33vw);
  --cy:41%;
  --sans:"Inter Tight","Noto Sans JP",system-ui,sans-serif;
  --serif:"Newsreader",Georgia,serif;
  --hp:400px; --ws:68px; --d:210px;
}
@media (max-width:767px){ :root{ --H:min(68vw,40svh); --cy:43%; } }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
@media (pointer:fine){ body, body *{cursor:none !important} }
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;-webkit-tap-highlight-color:transparent}
h1,h2,p{margin:0;font-weight:inherit}
:focus-visible{outline:1px solid var(--cobalt);outline-offset:4px}

.lbl{font-family:var(--sans);font-weight:600;font-size:10.5px;line-height:1;letter-spacing:.14em;text-transform:uppercase}
.box{display:inline-flex;align-items:center;height:21px;padding:0 8px;border:1px solid var(--rule)}

/* grano de papel */
.grain{
  position:fixed;inset:0;z-index:40;pointer-events:none;mix-blend-mode:multiply;opacity:.6;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .42 0 0 0 0 .38 0 0 0 .22 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:220px 220px;
}
#probe{position:fixed;left:0;top:var(--cy);width:0;height:var(--H);visibility:hidden;pointer-events:none}

/* barra superior */
.top{
  position:fixed;left:0;right:0;top:0;height:76px;padding:0 36px;z-index:30;
  display:flex;align-items:center;justify-content:space-between;color:var(--cobalt);
}
.brand{display:flex;align-items:center;gap:16px}
.brand .line{width:40px;height:1px;background:currentColor}
.nav{display:flex;align-items:center;gap:34px}
.burger{width:26px;height:12px;position:relative;display:block}
.burger::before,.burger::after{content:"";position:absolute;left:0;right:0;height:1.5px;background:var(--cobalt)}
.burger::before{top:0}.burger::after{bottom:0}

/* kanji en semitono */
.kanji{
  position:fixed;z-index:1;pointer-events:none;writing-mode:vertical-rl;
  font-family:"Noto Sans JP Big","Noto Sans JP",sans-serif;font-weight:800;
  font-size:min(19vh,12.5vw);line-height:1.02;letter-spacing:.02em;color:transparent;
  background:radial-gradient(circle at 50% 50%,rgba(64,82,138,.55) 0 36%,transparent 40%) 0 0/3px 3px,rgba(110,122,160,.26);
  -webkit-background-clip:text;background-clip:text;
}
.k-left{left:2.4vw;top:13vh}
.k-right{right:2.4vw;top:9vh}

/* sombra del suelo */
.floor{
  position:fixed;left:50%;top:calc(var(--cy) + var(--H) * .47);z-index:5;pointer-events:none;
  width:min(96vw,calc(var(--H) * 3.6));height:calc(var(--H) * .26);transform:translate(-50%,-50%);
  background:radial-gradient(50% 50% at 50% 40%,rgba(40,32,20,.30),rgba(40,32,20,.10) 55%,transparent 72%);
}

/* estantería */
.shelf{
  position:fixed;left:0;right:0;z-index:10;
  top:calc(var(--cy) - var(--H) / 2 - 50px);height:calc(var(--H) + 100px);
  perspective:1400px;perspective-origin:50% 50%;touch-action:pan-y;
}
.stage{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.tape{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.face{
  position:absolute;top:calc(var(--hp) / -2);height:var(--hp);border-radius:2px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;background-repeat:no-repeat;
}
.face::after{content:"";position:absolute;inset:0;border-radius:inherit;background:#000;opacity:var(--shade,0);pointer-events:none}
.sp{width:var(--ws);left:calc(var(--ws) / -2);transform:translateZ(calc(var(--d) / 2))}
.cv{width:var(--d);left:calc(var(--d) / -2);transform:rotateY(90deg) translateZ(calc(var(--ws) / 2));box-shadow:0 34px 60px -30px rgba(20,16,10,.6)}

/* aro de reproducción */
.play{
  position:fixed;left:0;top:0;width:42px;height:42px;z-index:15;pointer-events:none;border-radius:50%;
  border:1px solid var(--cobalt);background:rgba(236,232,224,.8);display:grid;place-items:center;
  transform:translate(-50%,-50%) scale(0);
}
.play svg{width:12px;height:12px;margin-left:2px}

/* pie de foto */
.caption{
  position:fixed;left:50%;top:calc(var(--cy) + var(--H) / 2 + 4.2vh);transform:translateX(-50%);z-index:12;
  display:grid;justify-items:center;gap:10px;color:var(--cobalt);pointer-events:none;
}
.mask{overflow:hidden;width:min(80vw,640px);display:grid;text-align:center}
.mask > .ln{grid-area:1/1;display:block;white-space:nowrap}
.c-title{font-weight:600;font-size:clamp(28px,3.4vw,46px);letter-spacing:-.015em;line-height:1.12;padding-bottom:.04em}
.c-sub{font-size:9.5px;letter-spacing:.24em;line-height:1.3}
.c-rule{width:18px;height:1px;background:var(--cobalt)}
.c-year{font-weight:500;font-size:10.5px;letter-spacing:.08em;color:var(--ink);line-height:1.3}

.arrow{
  position:fixed;z-index:13;width:44px;height:44px;display:grid;place-items:center;color:var(--cobalt);
  top:calc(var(--cy) + var(--H) / 2 + 4.2vh + clamp(28px,3.4vw,46px) * .56 - 22px);
}
.arrow svg{width:24px;height:12px;fill:none;stroke:currentColor;stroke-width:1.2}
.a-prev{left:calc(50% - min(19vw,250px));transform:translateX(-50%)}
.a-next{left:calc(50% + min(19vw,250px));transform:translateX(-50%)}

/* línea de tiempo */
.tl{position:fixed;left:36px;right:36px;bottom:64px;height:40px;z-index:12;color:var(--cobalt)}
.tl-line{position:absolute;left:0;right:0;top:12px;height:1px;background:var(--cobalt);opacity:.75}
.tick{position:absolute;width:1px;background:var(--cobalt);transform:translateX(-50%)}
.tick.maj{height:13px;top:6px;opacity:.75}
.tick.min{height:7px;top:9px;opacity:.4}
.yr{position:absolute;top:26px;font-weight:500;font-size:9.5px;letter-spacing:.06em;transform:translateX(-50%)}
.yr.first{transform:none}
.yr.last{transform:translateX(-100%)}
.tl-dot{position:absolute;top:8px;left:0;width:9px;height:9px;border-radius:50%;background:var(--cobalt);transform:translateX(-50%)}
.tl-hit{position:absolute;left:-10px;right:-10px;top:-8px;bottom:-4px}

.foot{position:fixed;left:36px;right:36px;bottom:24px;z-index:12;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;color:var(--cobalt)}
.foot > :last-child{white-space:nowrap}

/* cursor */
.cursor{position:fixed;left:0;top:0;width:58px;height:58px;z-index:100;pointer-events:none;opacity:0}
.cursor.on{opacity:1}
.c-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--ink);transition:transform .5s var(--ease),background-color .4s,border-color .4s}
.c-dot{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--ink);transition:transform .4s var(--ease)}
.c-lab{
  position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:3px;color:#fff;
  font-weight:600;font-size:10px;letter-spacing:.12em;line-height:1;transform:scale(0);transition:transform .45s var(--ease);
}
.cursor.open .c-ring{transform:scale(1.75);background:var(--cobalt);border-color:var(--cobalt)}
.cursor.open .c-dot{transform:scale(0)}
.cursor.open .c-lab{transform:scale(1)}
.cursor.spine .c-ring{transform:scale(.72)}
.cursor.btn .c-ring{transform:scale(.55)}
.cursor.btn .c-dot{transform:scale(0)}
@media (pointer:coarse){ .cursor{display:none} }

/* hoja de detalle */
.detail{
  position:fixed;inset:0;z-index:60;background:var(--sheet);display:none;
  grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);gap:4vw;padding:110px 6vw 56px 7vw;
}
.detail.on{display:grid}
.d-close{position:absolute;left:36px;top:28px;color:var(--ink)}
.d-brand{position:absolute;right:36px;top:28px;height:21px;color:var(--cobalt)}
.d-left{align-self:center;justify-self:end;width:100%;max-width:520px;display:grid;gap:18px;justify-items:start}
.m{overflow:hidden;display:block;max-width:100%}
.m > .r{display:block}
.d-sub{color:var(--cobalt)}
.d-title{font-weight:600;font-size:clamp(44px,5.2vw,80px);letter-spacing:-.03em;line-height:1.02;color:var(--cobalt);padding-bottom:.06em}
.d-meta{color:var(--muted)}
.d-syn{font-family:var(--serif);font-size:17px;line-height:1.5;max-width:42ch;font-weight:400}
.d-credit{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted)}
.d-watch{height:44px;padding:0 18px;border:1px solid var(--cobalt);color:var(--cobalt);display:inline-flex;align-items:center;gap:12px}
.d-right{display:flex;align-items:center;justify-content:flex-start;min-height:0}
.d-right svg{display:block;height:min(100%,78vh);width:auto;max-width:100%;aspect-ratio:474/900}

/* móvil */
@media (max-width:767px){
  .top{height:60px;padding:0 16px}
  .nav a{display:none}
  .brand .line{width:22px}
  .kanji{font-size:22vw;opacity:.8}
  .c-title{font-size:27px}
  .arrow{top:auto;bottom:118px}
  .a-prev{left:16px;transform:none}
  .a-next{left:auto;right:16px;transform:none}
  .tl{left:16px;right:16px;bottom:54px}
  .yr.odd{display:none}
  .foot{left:16px;right:16px}
  .detail{display:none;grid-template-columns:1fr;grid-template-rows:auto auto;overflow-y:auto;padding:76px 20px 40px;gap:28px}
  .detail.on{display:grid}
  .d-right{order:-1;justify-content:center}
  .d-right svg{height:46svh}
  .d-left{justify-self:start}
  .d-title{font-size:42px}
  .d-close{left:16px;top:20px}
  .d-brand{right:16px;top:20px}
}
</style>
</head>
<body>
<div id="probe" aria-hidden="true"></div>

<header class="top">
  <a class="brand lbl" href="#" aria-label="Leon Vasari, archivo fílmico">LEON VASARI <span class="line" aria-hidden="true"></span> ARCHIVO FÍLMICO</a>
  <nav class="nav" aria-label="Principal">
    <a class="lbl" href="#">Películas</a>
    <a class="lbl" href="#">Acerca de</a>
    <a class="lbl" href="#">Diario</a>
    <button class="burger" type="button" aria-label="Abrir menú"></button>
  </nav>
</header>

<div class="kanji k-left" aria-hidden="true">映画</div>
<div class="kanji k-right" aria-hidden="true">の記憶</div>
<div class="floor" aria-hidden="true"></div>

<section class="shelf" id="shelf" aria-label="Estantería de películas. Arrastra o usa las flechas para recorrerla; pulsa Intro para abrir la película activa.">
  <div class="stage" id="stage"></div>
</section>

<div class="play" id="play" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M1 0l11 6-11 6z" fill="#1F3FB0"/></svg></div>

<div class="caption" aria-live="polite">
  <h1 class="mask c-title" id="capTitle"></h1>
  <div class="mask lbl c-sub" id="capSub"></div>
  <div class="c-rule" aria-hidden="true"></div>
  <div class="mask c-year" id="capYear"></div>
</div>
<button class="arrow a-prev" id="prev" type="button" aria-label="Película anterior"><svg viewBox="0 0 24 12"><path d="M6 1L1 6l5 5M1 6h23"/></svg></button>
<button class="arrow a-next" id="next" type="button" aria-label="Película siguiente"><svg viewBox="0 0 24 12"><path d="M18 1l5 5-5 5M23 6H0"/></svg></button>

<div class="tl" id="tl">
  <div class="tl-line"></div>
  <div id="ticks"></div>
  <div class="tl-dot" id="dot"></div>
  <div class="tl-hit" id="tlHit" role="slider" aria-label="Línea de tiempo 1955–1990" aria-valuemin="1955" aria-valuemax="1990" aria-valuenow="1971"></div>
</div>

<footer class="foot">
  <span class="lbl">© Leon Vasari. Todos los derechos reservados.</span>
  <span class="lbl"><a href="#">FB</a> / <a href="#">TW</a></span>
</footer>

<section class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true">
  <button class="d-close lbl box" id="close" type="button">Cerrar / 閉じる</button>
  <div class="d-brand brand lbl">LEON VASARI <span class="line"></span> ARCHIVO FÍLMICO</div>
  <div class="d-left">
    <span class="m"><span class="r lbl d-sub" id="dSub"></span></span>
    <span class="m"><h2 class="r d-title" id="dTitle"></h2></span>
    <span class="m"><span class="r lbl d-meta" id="dMeta"></span></span>
    <span class="m"><p class="r d-syn" id="dSyn"></p></span>
    <span class="m"><p class="r d-credit">Escrita y dirigida por Leon Vasari. 監督作品</p></span>
    <span class="m"><span class="r"><button class="d-watch lbl" type="button">Ver la película / 映画を見る</button></span></span>
  </div>
  <div class="d-right">
    <svg viewBox="0 0 474 900" role="img" aria-label="Portada de la película">
      <defs>
        <clipPath id="pclip"><rect width="474" height="900"/></clipPath>
        <filter id="ink" x="-50%" y="-50%" width="200%" height="200%">
          <feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="3" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="120" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <mask id="pmask" maskUnits="userSpaceOnUse" x="0" y="0" width="474" height="900">
          <g filter="url(#ink)" id="blots">
            <circle cx="150" cy="330" r="0" fill="#fff"/>
            <circle cx="340" cy="600" r="0" fill="#fff"/>
            <circle cx="250" cy="120" r="0" fill="#fff"/>
            <circle cx="90" cy="760" r="0" fill="#fff"/>
            <circle cx="400" cy="250" r="0" fill="#fff"/>
            <circle cx="260" cy="860" r="0" fill="#fff"/>
            <circle cx="230" cy="470" r="0" fill="#fff"/>
          </g>
        </mask>
      </defs>
      <g clip-path="url(#pclip)"><image id="pimg" preserveAspectRatio="none" mask="url(#pmask)"/></g>
    </svg>
  </div>
</section>

<div class="grain" aria-hidden="true"></div>

<div class="cursor" id="cursor" aria-hidden="true">
  <div class="c-ring"></div><div class="c-dot"></div>
  <div class="c-lab"><span>ABRIR</span><span>開く</span></div>
</div>

<script>
(() => {
'use strict';

/* ---------- Recursos ---------- */
const PX = (f, w) => `https://images.higgs.ai/?default=1&output=webp&url=${encodeURIComponent('https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/' + f)}&w=${w}&q=85`;
const SHEET = {
  covers: [PX('hf_20261029_010644_837e04ca-2418-45c1-b8e0-0233265c4cd5.png', 1744), 1744, 2336],
  spines: [PX('hf_20261029_010738_a3e47ead-18f2-4974-9468-06d16a25edc5.png', 2688), 2688, 1152],
  fix:    [PX('hf_20261029_010831_3ebb874b-93dc-433e-87ed-6299aba720f0.png', 1520), 1520, 2688],
  fix2:   [PX('hf_20261029_092020_f96bc094-db7b-46de-9298-074a24e0a3b8.png', 1520), 1520, 2688],
};
const CROP = {
  'spine-valley': ['spines', 266, 31, 189, 1089],   'cover-valley': ['covers', 497, 72, 344, 659],
  'spine-bluehour': ['spines', 492, 31, 189, 1089], 'cover-bluehour': ['covers', 914, 72, 342, 659],
  'spine-river': ['fix', 197, 54, 324, 2566],       'cover-river': ['covers', 1332, 72, 344, 659],
  'spine-summer': ['spines', 937, 31, 188, 1089],   'cover-summer': ['covers', 74, 813, 344, 676],
  'spine-green': ['spines', 1157, 31, 185, 1090],   'cover-green': ['covers', 497, 815, 344, 674],
  'spine-noon': ['spines', 44, 32, 184, 1088],      'cover-noon': ['covers', 74, 72, 347, 659],
  'spine-observer': ['fix2', 371, 15, 349, 2655],   'cover-observer': ['covers', 915, 815, 342, 675],
  'spine-birds': ['spines', 1573, 31, 183, 1089],   'cover-birds': ['covers', 1331, 815, 345, 675],
  'spine-storm': ['fix2', 808, 15, 347, 2656],      'cover-storm': ['covers', 74, 1571, 345, 681],
  'spine-tide': ['spines', 2012, 31, 188, 1089],    'cover-tide': ['covers', 496, 1577, 343, 678],
  'spine-war': ['spines', 2236, 31, 189, 1089],     'cover-war': ['covers', 913, 1579, 343, 676],
  'spine-door': ['spines', 2462, 31, 188, 1089],    'cover-door': ['covers', 1331, 1579, 344, 677],
};
Object.values(SHEET).forEach(([u]) => { const im = new Image(); im.decoding = 'async'; im.src = u; });

function faceBg(key) {
  const [sh, x, y, w, h] = CROP[key];
  const [url, W, H] = SHEET[sh];
  return `background-image:url("${url}");background-size:${W / w * 100}% ${H / h * 100}%;background-position:${x / (W - w) * 100}% ${y / (H - h) * 100}%`;
}

/* ---------- Películas ---------- */
const FILMS = [
  { id: 'valley',   t: 'El valle silencioso',   ro: 'SHIZUKANA TANI',  kj: '静かな谷',   y: 1958, g: 'Drama',    min: 104, syn: 'Una maestra regresa al pueblo de montaña que desterró a su padre y descubre que el valle ha guardado cada uno de sus secretos.' },
  { id: 'bluehour', t: 'La hora azul',          ro: 'AO NO TOKI',      kj: '青の刻',     y: 1962, g: 'Romance',  min: 97,  syn: 'Durante una larga tarde en un pueblo portuario, una viuda y un desconocido se intercambian pequeñas mentiras hasta que se acaba la luz.' },
  { id: 'river',    t: 'Río de sal',            ro: 'SHIO NO KAWA',    kj: '塩の川',     y: 1964, g: 'Drama',    min: 121, syn: 'Dos hermanos arrastran una barcaza de sal río abajo hasta una ciudad que ya no quiere nada de lo que llevan.' },
  { id: 'summer',   t: 'El último verano',      ro: 'SAIGO NO NATSU',  kj: '最後の夏',   y: 1966, g: 'Drama',    min: 109, syn: 'El verano antes de que la presa inunde su pueblo, tres amigos prenden fuego a todo lo que no pueden llevarse.' },
  { id: 'green',    t: 'El camino verde',       ro: 'MIDORI NO MICHI', kj: '緑の道',     y: 1969, g: 'Misterio', min: 101, syn: 'Un agrimensor que traza un camino en el bosque no deja de encontrar las mismas huellas, siempre un día por delante de él.' },
  { id: 'noon',     t: 'Mediodía en cenizas',   ro: 'HAI NO SHOGO',    kj: '灰の正午',   y: 1971, g: 'Wéstern',  min: 112, syn: 'Un jinete cruza un desierto blanco para saldar una vieja deuda y descubre demasiado tarde quién lo envió.' },
  { id: 'observer', t: 'El observador',         ro: 'KANSATSUSHA',     kj: '観察者',     y: 1973, g: 'Suspense', min: 96,  syn: 'Un vigilante nocturno empieza a sospechar que el edificio que custodia ha comenzado a vigilarlo a él.' },
  { id: 'birds',    t: 'Los pájaros caídos',    ro: 'OCHITA TORI',     kj: '落ちた鳥',   y: 1975, g: 'Drama',    min: 118, syn: 'Cuando los pájaros dejan de cantar sobre un pueblo fronterizo, la hija del alcalde es la única que sale a buscar el motivo.' },
  { id: 'storm',    t: 'Luz en la tormenta',    ro: 'ARASHI NO HI',    kj: '嵐の灯',     y: 1978, g: 'Drama',    min: 127, syn: 'Un farero y su hijo esperan a que pase una tormenta de tres días junto a un marinero náufrago que se niega a decir su nombre.' },
  { id: 'tide',     t: 'La larga marea',        ro: 'NAGAI SHIO',      kj: '長い潮',     y: 1981, g: 'Drama',    min: 99,  syn: 'La mujer de un pescador cuenta las mareas en el muro del puerto mientras el barco de su marido no vuelve a casa.' },
  { id: 'war',      t: 'Una guerra silenciosa', ro: 'SHIZUKANA SENSO', kj: '静かな戦争', y: 1985, g: 'Comedia',  min: 103, syn: 'Dos vecinos libran durante treinta años una guerra silenciosa por el muro de un jardín, y ninguno quiere contar cómo empezó.' },
  { id: 'door',     t: 'La puerta roja',        ro: 'AKAI TOBIRA',     kj: '赤い扉',     y: 1989, g: 'Suspense', min: 114, syn: 'Un proyeccionista sigue una bobina de película desconocida por los pasillos de un cine en su última noche.' },
];
const N = 12, TOT = 36, START = 5 + 12;
const mod = (a, n) => ((a % n) + n) % n;
const smooth = (a) => a * a * (3 - 2 * a);

/* ---------- DOM ---------- */
const $ = (id) => document.getElementById(id);
const root = document.documentElement;
const stage = $('stage'), shelf = $('shelf'), probe = $('probe'), play = $('play');
const capTitle = $('capTitle'), capSub = $('capSub'), capYear = $('capYear');
const dot = $('dot'), tlHit = $('tlHit'), cursor = $('cursor');
const detail = $('detail'), pimg = $('pimg');
const blots = [...$('blots').children];
const BLOT_DELAY = [0, 120, 220, 300, 360, 420, 180];
const rmMQ = matchMedia('(prefers-reduced-motion: reduce)');
const RM = () => rmMQ.matches;
const EASE = 'cubic-bezier(.2,.8,.2,1)';

const tapes = [];
for (let c = 0; c < 3; c++) for (let i = 0; i < N; i++) {
  const f = FILMS[i];
  const el = document.createElement('div');
  el.className = 'tape';
  el.innerHTML = `<div class="face sp" style='${faceBg('spine-' + f.id)}'></div><div class="face cv" style='${faceBg('cover-' + f.id)}'></div>`;
  stage.appendChild(el);
  const t = { el, sp: el.children[0], cv: el.children[1], v: c * N + i, i, lift: 0 };
  el._t = t;
  tapes.push(t);
}

/* línea de tiempo */
(() => {
  const ticks = $('ticks'); let html = '', n = 0;
  for (let y = 1955; y <= 1990; y++) {
    const p = (y - 1955) / 35 * 100, maj = y % 5 === 0;
    html += `<span class="tick ${maj ? 'maj' : 'min'}" style="left:${p}%"></span>`;
    if (maj) {
      const cls = y === 1955 ? ' first' : y === 1990 ? ' last' : '';
      html += `<span class="yr${cls}${n % 2 ? ' odd' : ''}" style="left:${p}%">${y}</span>`;
      n++;
    }
  }
  ticks.innerHTML = html;
})();

/* ---------- Geometría ---------- */
let W = innerWidth, VH = innerHeight, H = 400, cy = 300, ws = 68, d = 210, gap = 14, U = 520;
const P = 1400;
let XS = new Float32Array(2);
function measure() {
  W = innerWidth; VH = innerHeight;
  const r = probe.getBoundingClientRect();
  H = r.height || 400; cy = r.top;
  ws = H * 142 / 840; d = H * 474 / 900; gap = H * .035;
  U = W < 768 ? H * 1.05 : H * 1.3;
  root.style.setProperty('--hp', H + 'px');
  root.style.setProperty('--ws', ws + 'px');
  root.style.setProperty('--d', d + 'px');
  const n = Math.ceil(3 * U / 2) + 2;
  XS = new Float32Array(n);
  let acc = 0;
  for (let i = 1; i < n; i++) { const u = i * 2; acc += 2 / (1 + Math.pow(u / U, 1.6)); XS[i] = acc; }
}
function xsc(u) {
  const a = Math.abs(u) / 2, i = Math.floor(a), n = XS.length - 1;
  let v;
  if (i >= n) v = XS[n] + (a - n) * 2 * (1 / (1 + Math.pow(Math.abs(u) / U, 1.6)));
  else v = XS[i] + (XS[i + 1] - XS[i]) * (a - i);
  return Math.sign(u) * v;
}
const B = (r) => Math.abs(r) < 1 ? (r + Math.sin(Math.PI * r) / Math.PI) / 2 : Math.sign(r) * .5;
const F = (r) => r * (ws + gap) + (d - ws + 1.4 * gap) * B(r);
const scl = (u) => 1 / (1 + Math.pow(Math.abs(u) / U, 1.6));
function rel(v, s) { let r = mod(v - s, TOT); if (r >= 18) r -= TOT; return r; }

/* ---------- Estado ---------- */
let s = START, T = START, active = 5;
let dragging = false, pressed = false, downX = 0, T0 = 0, downTape = null, moved = false;
let mx = W / 2, my = VH / 2, cx = mx, cyc = my, pointerIn = false, cursorShown = false;
let tiltX = 0, tiltY = 0, onCover = false, hoverTape = null, overBtn = false;
let dotYear = FILMS[5].y, isOpen = false, inkStart = -1e9, wheelTimer = 0;

/* ---------- Pie de foto ---------- */
function setLine(mask, html, dir, animate) {
  const span = document.createElement('span');
  span.className = 'ln';
  span.innerHTML = html;
  const olds = [...mask.children];
  mask.appendChild(span);
  if (!animate || RM()) { olds.forEach((o) => o.remove()); return; }
  span.animate([{ transform: `translateY(${dir * 105}%)` }, { transform: 'translateY(0)' }], { duration: 650, easing: EASE, fill: 'both' });
  olds.forEach((o) => {
    const cur = getComputedStyle(o).transform;
    o.getAnimations().forEach((a) => a.cancel());
    const a = o.animate([{ transform: cur === 'none' ? 'translateY(0)' : cur }, { transform: `translateY(${-dir * 105}%)` }], { duration: 650, easing: EASE, fill: 'both' });
    a.onfinish = () => o.remove();
  });
}
function setCaption(dir, animate) {
  const f = FILMS[active];
  setLine(capTitle, f.t, dir, animate);
  setLine(capSub, `${f.ro} / ${f.kj}`, dir, animate);
  setLine(capYear, `${f.y} — ${f.g.toUpperCase()}`, dir, animate);
  tlHit.setAttribute('aria-valuenow', f.y);
  tlHit.setAttribute('aria-valuetext', `${f.y}, ${f.t}`);
}

/* ---------- Detalle ---------- */
function activeTape() { return tapes[mod(Math.round(s), TOT)]; }
function coverInset() {
  const r = activeTape().cv.getBoundingClientRect();
  return `inset(${r.top}px ${W - r.right}px ${VH - r.bottom}px ${r.left}px round 3px)`;
}
function openDetail() {
  if (isOpen) return;
  T = Math.round(T);
  const f = FILMS[active];
  $('dSub').textContent = `${f.ro} / ${f.kj}`;
  $('dTitle').textContent = f.t;
  $('dMeta').textContent = `${f.y} / ${f.g} / ${f.min} min`;
  $('dSyn').textContent = f.syn;
  const [sh, x, y, w, h] = CROP['cover-' + f.id];
  const [url, SW, SH] = SHEET[sh];
  pimg.setAttribute('href', url);
  pimg.setAttribute('x', -x * 474 / w); pimg.setAttribute('y', -y * 900 / h);
  pimg.setAttribute('width', SW * 474 / w); pimg.setAttribute('height', SH * 900 / h);
  blots.forEach((b) => b.setAttribute('r', 0));
  const from = coverInset();
  isOpen = true;
  detail.getAnimations({ subtree: true }).forEach((a) => a.cancel());
  detail.classList.add('on');
  detail.setAttribute('aria-hidden', 'false');
  detail.scrollTop = 0;
  const rm = RM();
  detail.animate([{ clipPath: from }, { clipPath: 'inset(0px 0px 0px 0px round 0px)' }], { duration: rm ? 1 : 1050, easing: 'cubic-bezier(.76,0,.18,1)', fill: 'both' });
  detail.querySelectorAll('.r').forEach((el, i) => {
    el.animate([{ transform: 'translateY(110%)' }, { transform: 'translateY(0)' }], { duration: rm ? 1 : 900, delay: rm ? 0 : 620 + i * 75, easing: EASE, fill: 'both' });
  });
  const now = performance.now();
  inkStart = rm ? now - 5000 : now + 520;
  $('close').focus({ preventScroll: true });
}
function closeDetail() {
  if (!isOpen) return;
  isOpen = false;
  const to = coverInset();
  detail.getAnimations().forEach((a) => a.cancel());
  const a = detail.animate([{ clipPath: 'inset(0px 0px 0px 0px round 0px)' }, { clipPath: to }], { duration: RM() ? 1 : 850, easing: 'cubic-bezier(.76,0,.18,1)', fill: 'both' });
  a.onfinish = () => {
    if (isOpen) return;
    detail.classList.remove('on');
    detail.setAttribute('aria-hidden', 'true');
    detail.getAnimations({ subtree: true }).forEach((x) => x.cancel());
  };
  shelf.focus?.({ preventScroll: true });
}
$('close').addEventListener('click', closeDetail);

/* ---------- Entradas ---------- */
const step = (n) => { if (!isOpen) T = Math.round(T) + n; };
$('prev').addEventListener('click', () => step(-1));
$('next').addEventListener('click', () => step(1));

shelf.addEventListener('pointerdown', (e) => {
  if (isOpen || (e.pointerType === 'mouse' && e.button !== 0)) return;
  pressed = true; moved = false; downX = e.clientX; T0 = T;
  downTape = e.target.closest('.tape');
});
addEventListener('pointermove', (e) => {
  mx = e.clientX; my = e.clientY; pointerIn = true;
  if (e.pointerType === 'mouse' && !cursorShown) { cursorShown = true; cx = mx; cyc = my; cursor.classList.add('on'); }
  overBtn = !!e.target.closest?.('button, a, .tl-hit');
  const tp = e.target.closest?.('.tape');
  hoverTape = tp ? tp._t : null;
  if (!pressed) return;
  const dx = e.clientX - downX;
  if (!dragging && Math.abs(dx) > 5) {
    dragging = true; moved = true;
    try { shelf.setPointerCapture(e.pointerId); } catch {}
  }
  if (dragging) T = T0 - dx / (ws + gap);
});
function release(e) {
  if (!pressed) return;
  pressed = false;
  if (dragging) { dragging = false; T = Math.round(T); return; }
  if (moved || isOpen || !downTape) return;
  const t = downTape._t, r = rel(t.v, s);
  if (Math.abs(r) < .5 && Math.abs(T - s) < .3) openDetail();
  else T = Math.round(T + r);
}
addEventListener('pointerup', release);
addEventListener('pointercancel', () => { if (dragging) T = Math.round(T); pressed = dragging = false; });
document.addEventListener('pointerleave', () => { pointerIn = false; hoverTape = null; cursor.classList.remove('on'); cursorShown = false; });

addEventListener('wheel', (e) => {
  if (isOpen) return;
  e.preventDefault();
  const dl = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  const k = e.deltaMode === 1 ? 16 : 1;
  T += dl * k / (ws + gap) * .5;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => { T = Math.round(T); }, 160);
}, { passive: false });

addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeDetail(); return; }
  if (isOpen) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  else if (e.key === 'Enter' && !e.target.closest('button, a')) { e.preventDefault(); openDetail(); }
});

tlHit.addEventListener('click', (e) => {
  if (isOpen) return;
  const r = tlHit.parentElement.getBoundingClientRect();
  const year = 1955 + 35 * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  let best = 0;
  FILMS.forEach((f, i) => { if (Math.abs(f.y - year) < Math.abs(FILMS[best].y - year)) best = i; });
  const base = Math.round(T);
  let diff = mod(best - mod(base, N), N);
  if (diff > N / 2) diff -= N;
  T = base + diff;
});

addEventListener('resize', measure);
document.fonts?.ready.then(measure);

/* ---------- Bucle ---------- */
measure();
setCaption(1, false);
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  const rm = RM();

  // muelle
  if (rm) s = T;
  else s += (T - s) * (1 - Math.exp(-(dragging ? 18 : 5.2) * dt));
  if (!dragging && Math.abs(T - s) < 1e-4) s = T;
  if (Math.abs(s - START) > 48) { const sh = Math.round((s - START) / N) * N; s -= sh; T -= sh; T0 -= sh; }

  // película activa
  const act = mod(Math.round(s), N);
  if (act !== active) {
    const dir = Math.sign(T - s) || 1;
    active = act;
    setCaption(dir, true);
  }

  // punto de la línea de tiempo
  const f0 = Math.floor(s), fr = s - f0;
  const y0 = FILMS[mod(f0, N)].y, y1 = FILMS[mod(f0 + 1, N)].y;
  const yr = y1 < y0 ? (fr < .5 ? y0 : y1) : y0 + (y1 - y0) * fr;
  if (rm || Math.abs(yr - dotYear) > 6) dotYear = yr;
  else dotYear += (yr - dotYear) * (1 - Math.exp(-14 * dt));
  dot.style.left = ((dotYear - 1955) / 35 * 100) + '%';

  // inclinación de la portada
  const settled = Math.abs(T - s) < .3;
  onCover = !isOpen && settled && pointerIn && Math.abs(mx - W / 2) < .55 * d && Math.abs(my - cy) < .55 * H;
  let tY, tX;
  if (onCover) { tY = (mx - W / 2) / (.55 * d) * 8; tX = -(my - cy) / (H / 2) * 5; }
  else { tY = pointerIn && !isOpen ? (mx - W / 2) / W * 4 : 0; tX = 0; }
  const kt = 1 - Math.exp(-7 * dt);
  tiltY += (tY - tiltY) * kt; tiltX += (tX - tiltX) * kt;

  // cintas
  const kl = rm ? 1 : 1 - Math.exp(-12 * dt);
  for (const t of tapes) {
    const r = rel(t.v, s);
    const lt = hoverTape === t && Math.abs(r) > .5 && !isOpen ? 1 : 0;
    t.lift += (lt - t.lift) * kl;
    const a = Math.max(0, 1 - Math.abs(r)), o = smooth(a);
    const u = F(r);
    if (Math.abs(u) > U * 1.95) {
      if (!t.hidden) { t.el.style.visibility = 'hidden'; t.hidden = true; }
      continue;
    }
    if (t.hidden) { t.el.style.visibility = ''; t.hidden = false; }
    const sc = scl(u), k = 1 / sc;
    const z = P * (1 - k) + o * H * .1;
    const x = xsc(u) * k;
    const y = (H * .5 * (1 - sc) * .42 + o * H * .012 - t.lift * H * .05) * k;
    const ry = Math.sign(u) * Math.min(1, Math.abs(u) / U) * 26 * (1 - o) - 90 * o + tiltY * o;
    const rx = tiltX * o;
    t.el.style.transform = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,${z.toFixed(2)}px) rotateX(${rx.toFixed(3)}deg) rotateY(${ry.toFixed(3)}deg)`;
    t.el.style.zIndex = Math.round(3000 + z);
    t.sp.style.setProperty('--shade', Math.min(.6, o * .55 + (1 - sc) * .32).toFixed(3));
    t.cv.style.setProperty('--shade', ((1 - o) * .82).toFixed(3));
  }

  // aro de reproducción
  const ps = isOpen ? 0 : smooth(Math.max(0, 1 - Math.abs(T - s) * 3));
  play.style.left = (W / 2 - d / 2 - 6) + 'px';
  play.style.top = (cy + .36 * H) + 'px';
  play.style.transform = `translate(-50%,-50%) scale(${ps.toFixed(3)})`;

  // cursor
  const kc = 1 - Math.exp(-16 * dt);
  cx += (mx - cx) * kc; cyc += (my - cyc) * kc;
  cursor.style.transform = `translate3d(${cx - 29}px,${cyc - 29}px,0)`;
  const state = overBtn ? 'btn' : isOpen ? '' : onCover ? 'open' : hoverTape ? 'spine' : '';
  if (cursor.dataset.s !== state) {
    cursor.classList.remove('open', 'spine', 'btn');
    if (state) cursor.classList.add(state);
    cursor.dataset.s = state;
  }

  // tinta del póster
  if (isOpen) {
    for (let i = 0; i < blots.length; i++) {
      const p = Math.min(1, Math.max(0, (now - inkStart - BLOT_DELAY[i]) / 1250));
      blots[i].setAttribute('r', (720 * (1 - Math.pow(1 - p, 3))).toFixed(1));
    }
  }
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
