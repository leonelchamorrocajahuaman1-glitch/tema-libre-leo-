<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archivo Leon Vasari</title>
<meta name="description" content="Archivo fílmico de Leon Vasari: doce películas en VHS sobre una estantería curva.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Noto+Sans+JP:wght@500&family=VT323&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@800&text=%E6%98%A0%E7%94%BB%E3%81%AE%E8%A8%98%E6%86%B6&display=block">
<style>
:root{
  --paper:#ECE8E0; --sheet:#F3F0EA; --ink:#141414; --muted:#6D6A63; --cobalt:#1F3FB0; --rule:rgba(20,20,20,.9);
  --ease:cubic-bezier(.2,.8,.2,1);
  --H:min(47vh,33vw);
  --cy:41%;
  --sans:"Inter Tight","Noto Sans JP",system-ui,sans-serif;
  --serif:"Newsreader",Georgia,serif;
  --hp:400px; --ws:68px; --d:210px;
}
@media (max-width:767px){ :root{ --H:min(68vw,40svh); --cy:43%; } }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
@media (pointer:fine){ body, body *{cursor:none !important} }
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;-webkit-tap-highlight-color:transparent}
h1,h2,p{margin:0;font-weight:inherit}
:focus-visible{outline:1px solid var(--cobalt);outline-offset:4px}
[hidden]{display:none !important}

.lbl{font-family:var(--sans);font-weight:600;font-size:10.5px;line-height:1;letter-spacing:.14em;text-transform:uppercase}
.box{display:inline-flex;align-items:center;height:21px;padding:0 8px;border:1px solid var(--rule)}

/* grano de papel */
.grain{
  position:fixed;inset:0;z-index:40;pointer-events:none;mix-blend-mode:multiply;opacity:.6;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .42 0 0 0 0 .38 0 0 0 .22 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:220px 220px;
}
#probe{position:fixed;left:0;top:var(--cy);width:0;height:var(--H);visibility:hidden;pointer-events:none}

/* barra superior */
.top{
  position:fixed;left:0;right:0;top:0;height:76px;padding:0 36px;z-index:30;
  display:flex;align-items:center;justify-content:space-between;color:var(--cobalt);
}
.brand{display:flex;align-items:center;gap:16px}
.brand .line{width:40px;height:1px;background:currentColor}
.nav{display:flex;align-items:center;gap:34px}
.burger{width:26px;height:12px;position:relative;display:block}
.burger::before,.burger::after{content:"";position:absolute;left:0;right:0;height:1.5px;background:var(--cobalt)}
.burger::before{top:0}.burger::after{bottom:0}

/* kanji en semitono */
.kanji{
  position:fixed;z-index:1;pointer-events:none;writing-mode:vertical-rl;
  font-family:"Noto Sans JP Big","Noto Sans JP",sans-serif;font-weight:800;
  font-size:min(19vh,12.5vw);line-height:1.02;letter-spacing:.02em;color:transparent;
  background:radial-gradient(circle at 50% 50%,rgba(64,82,138,.55) 0 36%,transparent 40%) 0 0/3px 3px,rgba(110,122,160,.26);
  -webkit-background-clip:text;background-clip:text;
}
.k-left{left:2.4vw;top:13vh}
.k-right{right:2.4vw;top:9vh}

/* sombra del suelo */
.floor{
  position:fixed;left:50%;top:calc(var(--cy) + var(--H) * .47);z-index:5;pointer-events:none;
  width:min(96vw,calc(var(--H) * 3.6));height:calc(var(--H) * .26);transform:translate(-50%,-50%);
  background:radial-gradient(50% 50% at 50% 40%,rgba(40,32,20,.30),rgba(40,32,20,.10) 55%,transparent 72%);
}

/* estantería */
.shelf{
  position:fixed;left:0;right:0;z-index:10;
  top:calc(var(--cy) - var(--H) / 2 - 50px);height:calc(var(--H) + 100px);
  perspective:1400px;perspective-origin:50% 50%;touch-action:pan-y;
}
.stage{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.tape{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.face{
  position:absolute;top:calc(var(--hp) / -2);height:var(--hp);border-radius:2px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;background-repeat:no-repeat;
}
.face::after{content:"";position:absolute;inset:0;border-radius:inherit;background:#000;opacity:var(--shade,0);pointer-events:none}
.sp{width:var(--ws);left:calc(var(--ws) / -2);transform:translateZ(calc(var(--d) / 2))}
.cv{width:var(--d);left:calc(var(--d) / -2);transform:rotateY(90deg) translateZ(calc(var(--ws) / 2));box-shadow:0 34px 60px -30px rgba(20,16,10,.6)}

/* respaldo dibujado cuando las hojas de arte no cargan */
.ph{display:none}
.noart .face{background-image:none !important}
.noart .ph{display:flex}
.ph-sp{
  position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:space-between;gap:6%;
  padding:9% 0 7%;background:var(--fc);color:#F1E8D6;border-radius:inherit;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),inset 3px 0 0 rgba(255,255,255,.08);
}
.ph-sp .pic{width:74%;aspect-ratio:3/4;flex:none;background:var(--art,none) center/cover no-repeat,var(--sc);box-shadow:0 0 0 1px rgba(241,232,214,.55)}
.ph-sp .t{
  flex:1;min-height:0;writing-mode:vertical-rl;font-weight:600;font-size:calc(var(--ws) * .3);
  letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;line-height:1;overflow:hidden;
}
.ph-sp .v{font-weight:600;font-size:calc(var(--ws) * .13);letter-spacing:.14em;flex:none}
.ph-sp .b{font-weight:700;font-size:calc(var(--ws) * .13);border:1px solid currentColor;padding:2px 3px;letter-spacing:.06em;flex:none}
.ph-cv{
  position:absolute;inset:0;flex-direction:column;gap:3.5%;padding:9% 8% 8%;background:#EDE3CF;color:var(--fc);
  border-radius:inherit;overflow:hidden;font-family:var(--sans);
}
.ph-cv .k{font-size:calc(var(--d) * .042);letter-spacing:.2em;font-weight:600;line-height:1.2}
.ph-cv .t{font-weight:600;font-size:calc(var(--d) * .125);line-height:.95;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance}
.ph-cv .art{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--art,none) center/cover no-repeat,var(--fc)}
.has-art .art::before,.has-art .art::after{display:none}
.ph-cv .art::before{content:"";position:absolute;left:24%;top:18%;width:52%;aspect-ratio:1;border-radius:50%;background:var(--sc)}
.ph-cv .art::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:
  repeating-linear-gradient(180deg,#EDE3CF 0 2px,transparent 2px 9px),var(--fc);
}
.ph-cv .ft{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:calc(var(--d) * .045);letter-spacing:.14em}
.ph-cv .b{border:1px solid currentColor;padding:2px 6px;font-weight:700}

/* aro de reproducción */
.play{
  position:fixed;left:0;top:0;width:42px;height:42px;z-index:15;pointer-events:none;border-radius:50%;
  border:1px solid var(--cobalt);background:rgba(236,232,224,.8);display:grid;place-items:center;
  transform:translate(-50%,-50%) scale(0);
}
.play svg{width:12px;height:12px;margin-left:2px}

/* pie de foto */
.caption{
  position:fixed;left:50%;top:calc(var(--cy) + var(--H) / 2 + 4.2vh);transform:translateX(-50%);z-index:12;
  display:grid;justify-items:center;gap:10px;color:var(--cobalt);pointer-events:none;
}
.mask{overflow:hidden;width:min(80vw,640px);display:grid;text-align:center}
.mask > .ln{grid-area:1/1;display:block;white-space:nowrap}
.c-title{font-weight:600;font-size:clamp(28px,3.4vw,46px);letter-spacing:-.015em;line-height:1.12;padding-bottom:.04em}
.c-sub{font-size:9.5px;letter-spacing:.24em;line-height:1.3}
.c-rule{width:18px;height:1px;background:var(--cobalt)}
.c-year{font-weight:500;font-size:10.5px;letter-spacing:.08em;color:var(--ink);line-height:1.3}

.arrow{
  position:fixed;z-index:13;width:44px;height:44px;display:grid;place-items:center;color:var(--cobalt);
  top:calc(var(--cy) + var(--H) / 2 + 4.2vh + clamp(28px,3.4vw,46px) * .56 - 22px);
}
.arrow svg{width:24px;height:12px;fill:none;stroke:currentColor;stroke-width:1.2}
.a-prev{left:calc(50% - min(19vw,250px));transform:translateX(-50%)}
.a-next{left:calc(50% + min(19vw,250px));transform:translateX(-50%)}

/* línea de tiempo */
.tl{position:fixed;left:36px;right:36px;bottom:64px;height:40px;z-index:12;color:var(--cobalt)}
.tl-line{position:absolute;left:0;right:0;top:12px;height:1px;background:var(--cobalt);opacity:.75}
.tick{position:absolute;width:1px;background:var(--cobalt);transform:translateX(-50%)}
.tick.maj{height:13px;top:6px;opacity:.75}
.tick.min{height:7px;top:9px;opacity:.4}
.yr{position:absolute;top:26px;font-weight:500;font-size:9.5px;letter-spacing:.06em;transform:translateX(-50%)}
.yr.first{transform:none}
.yr.last{transform:translateX(-100%)}
.tl-dot{position:absolute;top:8px;left:0;width:9px;height:9px;border-radius:50%;background:var(--cobalt);transform:translateX(-50%)}
.tl-hit{position:absolute;left:-10px;right:-10px;top:-8px;bottom:-4px}

.foot{position:fixed;left:36px;right:36px;bottom:24px;z-index:12;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;color:var(--cobalt)}
.foot > :last-child{white-space:nowrap}

/* cursor */
.cursor{position:fixed;left:0;top:0;width:58px;height:58px;z-index:100;pointer-events:none;opacity:0}
.cursor.on{opacity:1}
.c-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--ink);transition:transform .5s var(--ease),background-color .4s,border-color .4s}
.c-dot{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--ink);transition:transform .4s var(--ease)}
.c-lab{
  position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:3px;color:#fff;
  font-weight:600;font-size:10px;letter-spacing:.12em;line-height:1;transform:scale(0);transition:transform .45s var(--ease);
}
.cursor.open .c-ring{transform:scale(1.75);background:var(--cobalt);border-color:var(--cobalt)}
.cursor.open .c-dot{transform:scale(0)}
.cursor.open .c-lab{transform:scale(1)}
.cursor.spine .c-ring{transform:scale(.72)}
.cursor.btn .c-ring{transform:scale(.55)}
.cursor.btn .c-dot{transform:scale(0)}
@media (pointer:coarse){ .cursor{display:none} }

/* hoja de detalle */
.detail{
  position:fixed;inset:0;z-index:60;background:var(--sheet);display:none;
  grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);gap:4vw;padding:110px 6vw 56px 7vw;
}
.detail.on{display:grid}
.d-close{position:absolute;left:36px;top:28px;color:var(--ink)}
.d-brand{position:absolute;right:36px;top:28px;height:21px;color:var(--cobalt)}
.d-left{align-self:center;justify-self:end;width:100%;max-width:520px;display:grid;gap:18px;justify-items:start}
.m{overflow:hidden;display:block;max-width:100%}
.m > .r{display:block}
.d-sub{color:var(--cobalt)}
.d-title{font-weight:600;font-size:clamp(44px,5.2vw,80px);letter-spacing:-.03em;line-height:1.02;color:var(--cobalt);padding-bottom:.06em}
.d-meta{color:var(--muted)}
.d-syn{font-family:var(--serif);font-size:17px;line-height:1.5;max-width:42ch;font-weight:400}
.d-credit{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted)}
.d-watch{height:44px;padding:0 18px;border:1px solid var(--cobalt);color:var(--cobalt);display:inline-flex;align-items:center;gap:12px}
.d-right{display:flex;align-items:center;justify-content:flex-start;min-height:0}
.d-right svg{display:block;height:min(100%,78vh);width:auto;max-width:100%;aspect-ratio:474/900}

/* botones de navegación */
.nav-link{color:inherit}
.nav-link[aria-expanded="true"],.nav-link.cur{text-decoration:underline;text-underline-offset:6px}

/* hojas: películas, acerca de, diario, menú */
.panel{
  position:fixed;inset:0;z-index:58;background:var(--sheet);display:none;overflow-y:auto;overscroll-behavior:contain;
  padding:110px 7vw 72px;
}
.panel.on{display:block}
.panel{padding-top:150px}
.panel .d-close{top:96px}
body.panel-open .top{z-index:59;background:var(--sheet)}
.p-body{max-width:1180px;margin:0 auto;display:grid;gap:36px}
.p-head{display:grid;gap:12px}
.p-h{font-weight:600;font-size:clamp(44px,6vw,96px);letter-spacing:-.03em;line-height:1;color:var(--cobalt);padding-bottom:.05em}
.p-k{color:var(--muted)}
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:34px 22px}
.p-film{display:grid;gap:10px;text-align:left;align-content:start}
.p-cv{display:block;width:100%;aspect-ratio:196/382;background-repeat:no-repeat;border-radius:2px;
  box-shadow:0 22px 34px -22px rgba(20,16,10,.55);transition:transform .45s var(--ease)}
.p-film:hover .p-cv,.p-film:focus-visible .p-cv{transform:translateY(-6px)}
.p-film.cur .p-cv{outline:1px solid var(--cobalt);outline-offset:5px}
.p-ft{font-weight:600;font-size:16px;letter-spacing:-.01em;color:var(--cobalt);line-height:1.15}
.p-fm{color:var(--muted);font-size:9.5px}
.p-about{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:6vw;align-items:start}
.p-bio{display:grid;gap:18px;font-family:var(--serif);font-size:19px;line-height:1.55;max-width:60ch}
.p-facts{display:grid;gap:0;border-top:1px solid var(--rule)}
.p-facts div{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid rgba(20,20,20,.18)}
.p-facts dt{color:var(--muted)}
.p-facts dd{margin:0;font-weight:500;font-size:14px}
.p-journal{display:grid;border-top:1px solid var(--rule)}
.p-entry{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:24px;padding:26px 0;border-bottom:1px solid rgba(20,20,20,.18);align-items:baseline}
.p-entry h3{margin:0 0 8px;font-weight:600;font-size:22px;letter-spacing:-.015em;color:var(--cobalt)}
.p-entry p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.5;max-width:62ch}
.p-entry .go{justify-self:end;color:var(--cobalt)}
.p-menu{display:grid;border-top:1px solid var(--rule)}
.p-menu button{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid rgba(20,20,20,.18);text-align:left;color:var(--cobalt)}
.p-menu .big{font-weight:600;font-size:clamp(40px,7vw,92px);letter-spacing:-.03em;line-height:1}
.p-menu .lbl{color:var(--muted)}
.p-social{display:flex;gap:24px;color:var(--cobalt)}
.p-social a{text-decoration:underline;text-underline-offset:4px}
.m.blk{display:block}

/* reproductor VHS */
.player{position:fixed;inset:0;z-index:80;background:#070707;display:none;color:#F3F0EA}
.player.on{display:block}
.pv-screen{
  position:absolute;left:50%;top:46%;width:min(92vw,118vh);aspect-ratio:4/3;max-height:80vh;transform:translate(-50%,-50%);
  overflow:hidden;background:#000;border-radius:14px/18px;box-shadow:0 0 0 1px #1c1c1c,0 40px 120px rgba(0,0,0,.6);
}
.pv-art{
  position:absolute;left:50%;top:0;width:102%;aspect-ratio:196/382;background-repeat:no-repeat;
  transform:translate(-50%,-44%);filter:blur(1.1px) contrast(1.1) saturate(1.2);
}
.pv-card{position:absolute;inset:0;background:#000;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:0 8%}
.pv-card .pv-pre{font-family:"VT323",ui-monospace,monospace;font-size:clamp(16px,2.2vw,24px);letter-spacing:.18em;text-transform:uppercase;color:#cfc8b8}
.pv-card strong{font-weight:600;font-size:clamp(30px,5vw,64px);letter-spacing:-.02em;line-height:1.05;color:#F3F0EA}
.pv-card span:last-child{font-family:"Noto Sans JP",sans-serif;font-size:clamp(14px,1.6vw,18px);color:#cfc8b8}
#pvStatic{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.pv-lines{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.pv-lines::after{content:"";position:absolute;left:0;right:0;height:14%;top:-15%;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.07) 45%,rgba(255,255,255,.12) 50%,transparent);
  animation:track 7s linear infinite}
@keyframes track{to{top:115%}}
.player.paused .pv-lines::after{animation-play-state:paused}
.pv-osd{position:absolute;font-family:"VT323",ui-monospace,monospace;font-size:clamp(20px,2.6vw,32px);letter-spacing:.04em;color:#fff;
  text-shadow:2px 0 rgba(255,40,40,.55),-2px 0 rgba(40,120,255,.55);display:flex;align-items:center;gap:10px}
.pv-osd svg{width:.6em;height:.6em;fill:#fff}
.pv-tl{left:5%;top:5%}.pv-tr{right:5%;top:5%}.pv-br{right:5%;bottom:5%;font-variant-numeric:tabular-nums}
.pv-ctrl{position:absolute;left:50%;bottom:max(24px,4vh);transform:translateX(-50%);display:flex;gap:12px}
.pv-btn{height:40px;padding:0 16px;border:1px solid rgba(243,240,234,.6);color:#F3F0EA;white-space:nowrap}
.pv-btn:hover{background:rgba(243,240,234,.1)}

/* móvil */
@media (max-width:767px){
  .top{height:60px;padding:0 16px}
  .nav a{display:none}
  .brand .line{width:22px}
  .kanji{font-size:22vw;opacity:.8}
  .c-title{font-size:27px}
  .arrow{top:auto;bottom:118px}
  .a-prev{left:16px;transform:none}
  .a-next{left:auto;right:16px;transform:none}
  .tl{left:16px;right:16px;bottom:54px}
  .yr.odd{display:none}
  .foot{left:16px;right:16px}
  .detail{display:none;grid-template-columns:1fr;grid-template-rows:auto auto;overflow-y:auto;padding:76px 20px 40px;gap:28px}
  .detail.on{display:grid}
  .d-right{order:-1;justify-content:center}
  .d-right svg{height:46svh}
  .d-left{justify-self:start}
  .d-title{font-size:42px}
  .d-close{left:16px;top:20px}
  .d-brand{right:16px;top:20px}
  .panel{padding:124px 20px 48px}
  .panel .d-close{top:74px}
  .p-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 16px}
  .p-about{grid-template-columns:1fr}
  .p-entry{grid-template-columns:1fr;gap:8px}
  .p-entry .go{justify-self:start}
  .p-bio{font-size:17px}
  .pv-screen{top:42%}
  .pv-ctrl{bottom:max(28px,6vh)}
}
</style>
</head>
<body>
<div id="probe" aria-hidden="true"></div>

<header class="top">
  <a class="brand lbl" href="#" id="home" aria-label="Leon Vasari, archivo fílmico: volver al inicio">LEON VASARI <span class="line" aria-hidden="true"></span> ARCHIVO FÍLMICO</a>
  <nav class="nav" aria-label="Principal">
    <button class="lbl nav-link" type="button" data-panel="films">Películas</button>
    <button class="lbl nav-link" type="button" data-panel="about">Acerca de</button>
    <button class="lbl nav-link" type="button" data-panel="journal">Diario</button>
    <button class="burger" type="button" id="menuBtn" data-panel="menu" aria-label="Abrir menú" aria-expanded="false"></button>
  </nav>
</header>

<div class="kanji k-left" aria-hidden="true">映画</div>
<div class="kanji k-right" aria-hidden="true">の記憶</div>

})();

  }
  if (pvPhase === 'static') { pvStatic.hidden = false; drawStatic(-1); }
  else if (pvPhase === 'film' && !RM() && !pvPaused && now > pvGlitchAt) {
    pvStatic.hidden = false; drawStatic(((now / 4) % 164) - 10);
    if (now > pvGlitchAt + 140) { pvGlitchAt = now + 4000 + Math.random() * 5000; pvStatic.hidden = true; }
  } else if (pvPhase !== 'static') pvStatic.hidden = true;
}
function setPhase(ph) {
  pvPhase = ph;
  pvCard.hidden = ph !== 'card';
  pvArt.hidden = ph !== 'film';
  if (ph === 'film') {
    pvT0 = performance.now(); pvGlitchAt = pvT0 + 3500;
    pvPan = pvArt.animate([
      { transform: 'translate(-50%,-38%) scale(1)' },
      { transform: 'translate(-50%,-47%) scale(1.1)' }],
      { duration: RM() ? 1 : 42000, easing: 'ease-in-out', fill: 'both', direction: 'alternate', iterations: Infinity });
  }
}
function openPlayer() {
  if (playerOn) return;
  const f = FILMS[active];
  $('pvTitle').textContent = f.t; $('pvKj').textContent = f.kj;
  pvArt.setAttribute('style', faceBg('cover-' + f.id));
  pvElapsed = 0; pvPaused = false; pvTime.textContent = '0:00:00';
  player.classList.remove('paused');
  pvMode.firstChild.nodeValue = 'PLAY ';
  pvToggle.textContent = 'Pausa / 一時停止';
  playerOn = true;
  player.classList.add('on'); player.setAttribute('aria-hidden', 'false');
  const scr = $('pvScreen');
  scr.getAnimations().forEach((a) => a.cancel());
  if (!RM()) scr.animate([{ transform: 'translate(-50%,-50%) scale(1,.004)' }, { transform: 'translate(-50%,-50%) scale(1,1)' }], { duration: 380, easing: EASE });
  const rm = RM();
  setPhase(rm ? 'card' : 'static');
  pvTimers.forEach(clearTimeout);
  pvTimers = [setTimeout(() => setPhase('card'), rm ? 0 : 1100), setTimeout(() => setPhase('film'), rm ? 1500 : 3800)];
  pvRaf = requestAnimationFrame(pvLoop);
  pvToggle.focus({ preventScroll: true });
}
function closePlayer() {
  if (!playerOn) return;
  pvTimers.forEach(clearTimeout);
  const scr = $('pvScreen');
  const done = () => {
    playerOn = false; cancelAnimationFrame(pvRaf);
    pvPan?.cancel(); pvPan = null; pvPhase = '';
    player.classList.remove('on'); player.setAttribute('aria-hidden', 'true');
    scr.getAnimations().forEach((a) => a.cancel());
    $('watch').focus({ preventScroll: true });
  };
  if (RM()) { done(); return; }
  const a = scr.animate([
    { transform: 'translate(-50%,-50%) scale(1,1)' },
    { transform: 'translate(-50%,-50%) scale(1,.004)', offset: .6 },
    { transform: 'translate(-50%,-50%) scale(0,.004)' }], { duration: 420, easing: 'ease-in', fill: 'both' });
  a.onfinish = done;
}
function togglePlayer() {
  if (pvPhase !== 'film') return;
  pvPaused = !pvPaused;
  player.classList.toggle('paused', pvPaused);
  if (pvPaused) { pvElapsed += (performance.now() - pvT0) / 1000; pvPan?.pause(); }
  else { pvT0 = performance.now(); pvPan?.play(); }
  pvMode.firstChild.nodeValue = pvPaused ? 'PAUSA ' : 'PLAY ';
  pvToggle.textContent = pvPaused ? 'Reproducir / 再生' : 'Pausa / 一時停止';
}
$('watch').addEventListener('click', openPlayer);
$('pvStop').addEventListener('click', closePlayer);
pvToggle.addEventListener('click', togglePlayer);

addEventListener('resize', measure);
document.fonts?.ready.then(measure);

/* ---------- Bucle ---------- */
measure();
setCaption(1, false);
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  const rm = RM();

  // muelle
  if (rm) s = T;
  else s += (T - s) * (1 - Math.exp(-(dragging ? 18 : 5.2) * dt));
  if (!dragging && Math.abs(T - s) < 1e-4) s = T;
  if (Math.abs(s - START) > 48) { const sh = Math.round((s - START) / N) * N; s -= sh; T -= sh; T0 -= sh; }

  // película activa
  const act = mod(Math.round(s), N);
  if (act !== active) {
    const dir = Math.sign(T - s) || 1;
    active = act;
    setCaption(dir, true);
  }

  // punto de la línea de tiempo
  const f0 = Math.floor(s), fr = s - f0;
  const y0 = FILMS[mod(f0, N)].y, y1 = FILMS[mod(f0 + 1, N)].y;
  const yr = y1 < y0 ? (fr < .5 ? y0 : y1) : y0 + (y1 - y0) * fr;
  if (rm || Math.abs(yr - dotYear) > 6) dotYear = yr;
  else dotYear += (yr - dotYear) * (1 - Math.exp(-14 * dt));
  dot.style.left = ((dotYear - 1955) / 35 * 100) + '%';

  // inclinación de la portada
  const blk = blocked();
  const settled = Math.abs(T - s) < .3;
  onCover = !blk && settled && pointerIn && Math.abs(mx - W / 2) < .55 * d && Math.abs(my - cy) < .55 * H;
  let tY, tX;
  if (onCover) { tY = (mx - W / 2) / (.55 * d) * 8; tX = -(my - cy) / (H / 2) * 5; }
  else { tY = pointerIn && !blk ? (mx - W / 2) / W * 4 : 0; tX = 0; }
  const kt = 1 - Math.exp(-7 * dt);
  tiltY += (tY - tiltY) * kt; tiltX += (tX - tiltX) * kt;

  // cintas
  const kl = rm ? 1 : 1 - Math.exp(-12 * dt);
  for (const t of tapes) {
    const r = rel(t.v, s);
    const lt = hoverTape === t && Math.abs(r) > .5 && !blk ? 1 : 0;
    t.lift += (lt - t.lift) * kl;
    const a = Math.max(0, 1 - Math.abs(r)), o = smooth(a);
    const u = F(r);
    if (Math.abs(u) > U * 1.95) {
      if (!t.hidden) { t.el.style.visibility = 'hidden'; t.hidden = true; }
      continue;
    }
    if (t.hidden) { t.el.style.visibility = ''; t.hidden = false; }
    const sc = scl(u), k = 1 / sc;
    const z = P * (1 - k) + o * H * .1;
    const x = xsc(u) * k;
    const y = (H * .5 * (1 - sc) * .42 + o * H * .012 - t.lift * H * .05) * k;
    const ry = Math.sign(u) * Math.min(1, Math.abs(u) / U) * 26 * (1 - o) - 90 * o + tiltY * o;
    const rx = tiltX * o;
    t.el.style.transform = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,${z.toFixed(2)}px) rotateX(${rx.toFixed(3)}deg) rotateY(${ry.toFixed(3)}deg)`;
    t.el.style.zIndex = Math.round(3000 + z);
    t.sp.style.setProperty('--shade', Math.min(.6, o * .55 + (1 - sc) * .32).toFixed(3));
    t.cv.style.setProperty('--shade', ((1 - o) * .82).toFixed(3));
  }

  // aro de reproducción
  const ps = blk ? 0 : smooth(Math.max(0, 1 - Math.abs(T - s) * 3));
  play.style.left = (W / 2 - d / 2 - 6) + 'px';
  play.style.top = (cy + .36 * H) + 'px';
  play.style.transform = `translate(-50%,-50%) scale(${ps.toFixed(3)})`;

  // cursor
  const kc = 1 - Math.exp(-16 * dt);
  cx += (mx - cx) * kc; cyc += (my - cyc) * kc;
  cursor.style.transform = `translate3d(${cx - 29}px,${cyc - 29}px,0)`;
  const state = overBtn ? 'btn' : blk ? '' : onCover ? 'open' : hoverTape ? 'spine' : '';
  if (cursor.dataset.s !== state) {
    cursor.classList.remove('open', 'spine', 'btn');
    if (state) cursor.classList.add(state);
    cursor.dataset.s = state;
  }

  // tinta del póster
  if (isOpen) {
    for (let i = 0; i < blots.length; i++) {
      const p = Math.min(1, Math.max(0, (now - inkStart - BLOT_DELAY[i]) / 1250));
      blots[i].setAttribute('r', (720 * (1 - Math.pow(1 - p, 3))).toFixed(1));
    }
  }
}
requestAnimationFrame(frame);
})();
</script>
</body>
